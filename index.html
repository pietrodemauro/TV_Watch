<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">

    <!-- NAVBAR -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="switchView('home')">
                    <span class="text-2xl font-bold text-yellow-500">📺 Tracker</span>
                </div>
                <div class="flex space-x-4">
                    <button onclick="switchView('movies')" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium">🎬 Movies</button>
                    <button onclick="switchView('series')" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium">📺 TV Shows</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto p-6">
        
        <!-- HOME -->
        <div id="view-home" class="view-section text-center py-20">
            <h1 class="text-5xl font-extrabold mb-6">Welcome Back!</h1>
            <div class="flex justify-center space-x-6 mt-12">
                <div onclick="switchView('movies')" class="cursor-pointer bg-gray-800 hover:bg-gray-700 p-10 rounded-xl shadow-lg border border-gray-700 transform hover:scale-105 transition">
                    <div class="text-6xl mb-4">🍿</div><h2 class="text-2xl font-bold">Movies</h2>
                </div>
                <div onclick="switchView('series')" class="cursor-pointer bg-gray-800 hover:bg-gray-700 p-10 rounded-xl shadow-lg border border-gray-700 transform hover:scale-105 transition">
                    <div class="text-6xl mb-4">🛋️</div><h2 class="text-2xl font-bold">TV Shows</h2>
                </div>
            </div>
        </div>

        <!-- MOVIES -->
        <div id="view-movies" class="view-section hidden">
            <div class="bg-gray-800 p-4 rounded-lg shadow mb-8 flex space-x-2">
                <input type="text" id="movieSearch" placeholder="Title or IMDB ID (tt...)" class="flex-1 bg-gray-700 p-3 rounded text-white outline-none">
                <button onclick="addMovie()" id="btn-add-movie" class="bg-yellow-600 hover:bg-yellow-500 px-6 rounded font-bold">Add Movie</button>
            </div>
            <h2 class="text-3xl font-semibold mb-4 border-b border-gray-700 pb-2">Watchlist</h2>
            <div id="moviesWatchlist" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 mb-12"></div>
            <h2 class="text-3xl font-semibold mb-4 border-b border-gray-700 pb-2 text-gray-400">Watched</h2>
            <div id="moviesWatched" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 opacity-75"></div>
        </div>

        <!-- TV SERIES -->
        <div id="view-series" class="view-section hidden relative">
            <div class="bg-gray-800 p-4 rounded-lg shadow mb-8 flex space-x-2">
                <input type="text" id="seriesSearch" placeholder="Title or IMDB ID (tt...)" class="flex-1 bg-gray-700 p-3 rounded text-white outline-none">
                <button onclick="addSeries()" id="btn-add-series" class="bg-blue-600 hover:bg-blue-500 px-6 rounded font-bold">Add Show</button>
            </div>
            <h2 class="text-3xl font-semibold mb-4 border-b border-gray-700 pb-2">My Shows</h2>
            <div id="seriesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>

            <!-- EPISODES MODAL -->
            <div id="episodesModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex justify-center items-center p-4">
                <div class="bg-gray-800 rounded-lg w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl border border-gray-700">
                    <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                        <h2 id="episodesModalTitle" class="text-2xl font-bold text-yellow-500">Title</h2>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
                    </div>
                    <div class="p-4 overflow-y-auto flex-1">
                        <ul id="episodesList" class="space-y-2"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = "/api";
        const PLACEHOLDER_IMG = "https://via.placeholder.com/300x450/374151/9CA3AF?text=No+Poster";
        let globalSeries = [];

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            if (viewName === 'movies') loadMovies();
            if (viewName === 'series') loadSeries();
        }

        function getPoster(url) { return (url && url !== "N/A") ? url : PLACEHOLDER_IMG; }

        function highlightCard(elementId) {
            const el = document.getElementById(elementId);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-4', 'ring-yellow-500', 'transform', 'scale-105', 'z-10');
                setTimeout(() => el.classList.remove('ring-4', 'ring-yellow-500', 'transform', 'scale-105', 'z-10'), 3000);
            }
        }

        // --- MOVIES ---
        async function loadMovies() {
            const res = await fetch(`${API}/movies`);
            const movies = await res.json();
            const watchlist = document.getElementById('moviesWatchlist');
            const watched = document.getElementById('moviesWatched');
            watchlist.innerHTML = ''; watched.innerHTML = '';

            movies.forEach(m => {
                const actionBtn = !m.is_watched 
                    ? `<button onclick="toggleMovie(${m.id})" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1 rounded mb-2 w-full shadow">✔ Mark Watched</button>`
                    : `<button onclick="toggleMovie(${m.id})" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1 rounded mb-2 w-full shadow">👀 To Watchlist</button>`;

                let ratingOptions = `<option value="0">Rate...</option>`;
                for(let i=1; i<=10; i++) {
                    ratingOptions += `<option value="${i}" ${m.voto === i ? 'selected' : ''}>⭐ ${i}/10</option>`;
                }

                const card = `
                    <div id="movie-card-${m.id}" class="bg-gray-800 rounded-lg overflow-hidden shadow-lg group relative border border-gray-700 transition-all duration-500">
                        <img src="${getPoster(m.locandina_url)}" class="w-full aspect-[2/3] object-cover">
                        ${m.voto ? `<div class="absolute top-2 right-2 bg-yellow-500 text-black font-bold px-2 py-1 rounded-full text-xs shadow">⭐ ${m.voto}</div>` : ''}
                        
                        <div class="absolute inset-0 bg-black bg-opacity-90 flex flex-col justify-center items-center opacity-0 group-hover:opacity-100 transition-opacity p-3 text-center">
                            <span class="font-bold mb-1 text-sm">${m.titolo}</span>
                            <span class="text-xs text-gray-400 mb-3">${m.anno || ''}</span>
                            <select onchange="rateMovie(${m.id}, this.value)" class="bg-gray-700 text-white text-xs rounded px-2 py-1 mb-3 w-full text-center outline-none cursor-pointer shadow">
                                ${ratingOptions}
                            </select>
                            ${actionBtn}
                            <button onclick="deleteMovie(${m.id})" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded w-full shadow">🗑 Delete</button>
                        </div>
                    </div>`;
                
                if (m.is_watched) watched.innerHTML += card;
                else watchlist.innerHTML += card;
            });
        }

        async function addMovie() {
            const query = document.getElementById('movieSearch').value;
            if(!query) return;
            document.getElementById('btn-add-movie').innerText = "Searching...";
            try {
                const res = await fetch(`${API}/movies/add`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query}) });
                const data = await res.json();
                if(res.ok) { 
                    document.getElementById('movieSearch').value = ''; 
                    await loadMovies(); 
                    if (data.status === "exists") highlightCard(`movie-card-${data.id}`);
                } else alert("Movie not found on OMDB!");
            } catch(e) { alert("Connection Error."); }
            finally { document.getElementById('btn-add-movie').innerText = "Add Movie"; }
        }

        async function toggleMovie(id) { await fetch(`${API}/movies/${id}/toggle`, { method: 'PUT' }); loadMovies(); }
        async function deleteMovie(id) { if(confirm("Permanently delete?")) { await fetch(`${API}/movies/${id}`, { method: 'DELETE' }); loadMovies(); } }
        async function rateMovie(id, voto) { await fetch(`${API}/movies/${id}/rate`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({voto: parseInt(voto)}) }); loadMovies(); }

        // --- TV SERIES ---
        async function loadSeries() {
            const res = await fetch(`${API}/series`);
            globalSeries = await res.json();
            const grid = document.getElementById('seriesGrid');
            grid.innerHTML = '';

            globalSeries.forEach(s => {
                grid.innerHTML += `
                    <div id="series-card-${s.id}" class="bg-gray-800 rounded-lg overflow-hidden shadow-lg group relative border border-gray-700 transition-all duration-500">
                        <img src="${getPoster(s.locandina_url)}" class="w-full aspect-[2/3] object-cover cursor-pointer" onclick="openEpisodes(${s.id})">
                        <div class="absolute top-0 left-0 right-0 p-2 flex justify-end opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                            <button onclick="deleteSeries(${s.id}); event.stopPropagation();" class="bg-red-600 hover:bg-red-500 text-white p-2 rounded-full shadow pointer-events-auto" title="Delete series">🗑</button>
                        </div>
                        <div class="p-3 bg-gray-800 text-center cursor-pointer" onclick="openEpisodes(${s.id})">
                            <h3 class="font-bold text-sm truncate">${s.titolo}</h3>
                            ${s.stato === 'Ended' ? '<span class="text-xs text-red-400">Ended</span>' : '<span class="text-xs text-green-400">Continuing</span>'}
                        </div>
                    </div>`;
            });
        }

        async function addSeries() {
            const query = document.getElementById('seriesSearch').value;
            if(!query) return;
            document.getElementById('btn-add-series').innerText = "Fetching..."; 
            try {
                const res = await fetch(`${API}/series/add`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query}) });
                const data = await res.json();
                if(res.ok) { 
                    document.getElementById('seriesSearch').value = ''; 
                    await loadSeries(); 
                    if (data.status === "exists") { highlightCard(`series-card-${data.id}`); openEpisodes(data.id); }
                } else alert("Show not found on OMDB!");
            } catch(e) { alert("Connection Error."); }
            finally { document.getElementById('btn-add-series').innerText = "Add Show"; }
        }

        async function deleteSeries(id) { if(confirm("This deletes the show and all watched progress. Confirm?")) { await fetch(`${API}/series/${id}`, { method: 'DELETE' }); loadSeries(); } }

        async function openEpisodes(serieId) {
            const serie = globalSeries.find(x => x.id === serieId);
            document.getElementById('episodesModalTitle').innerText = serie ? serie.titolo : 'Episodes';
            document.getElementById('episodesModal').classList.remove('hidden');
            
            const list = document.getElementById('episodesList');
            list.innerHTML = '<p class="text-center text-gray-400">Loading episodes...</p>';

            const res = await fetch(`${API}/series/${serieId}/episodes`);
            const episodes = await res.json();
            list.innerHTML = '';

            episodes.forEach(ep => {
                const btn = !ep.is_watched 
                    ? `<button onclick="toggleEpisode(${ep.id}, ${serieId})" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-bold shadow shrink-0">✔ Watched</button>` 
                    : `<button onclick="toggleEpisode(${ep.id}, ${serieId})" class="bg-gray-600 hover:bg-gray-500 px-3 py-1 rounded text-xs font-bold shadow shrink-0">↺ Undo</button>`;

                let epRatingOptions = `<option value="0">-</option>`;
                for(let i=1; i<=10; i++) {
                    epRatingOptions += `<option value="${i}" ${ep.voto === i ? 'selected' : ''}>${i}</option>`;
                }

                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-700 p-2 md:p-3 rounded ${ep.is_watched ? 'opacity-50' : ''} gap-2">
                        <div class="flex-1 min-w-0">
                            <span class="font-bold text-yellow-500 mr-2">S${String(ep.stagione).padStart(2,'0')}xE${String(ep.numero_episodio).padStart(2,'0')}</span> 
                            <span class="${ep.is_watched ? 'line-through text-gray-400' : 'text-gray-100'} break-words">${ep.titolo_episodio}</span>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            ${ep.voto ? `<span class="text-yellow-500 text-xs font-bold hidden md:inline">⭐ ${ep.voto}</span>` : ''}
                            <select onchange="rateEpisode(${ep.id}, this.value, ${serieId})" class="bg-gray-800 text-gray-300 text-xs rounded p-1 border border-gray-600 outline-none cursor-pointer">
                                ${epRatingOptions}
                            </select>
                            ${btn}
                        </div>
                    </li>`;
            });
        }

        async function toggleEpisode(epId, serieId) { await fetch(`${API}/episodes/${epId}/toggle`, { method: 'PUT' }); openEpisodes(serieId); }
        async function rateEpisode(epId, voto, serieId) { await fetch(`${API}/episodes/${epId}/rate`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({voto: parseInt(voto)}) }); openEpisodes(serieId); }

        function closeModal() { document.getElementById('episodesModal').classList.add('hidden'); }

        loadMovies();
        loadSeries();
    </script>
</body>
</html>
